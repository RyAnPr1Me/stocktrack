{% extends "auth_base.html" %}
{% block title %}Sign In — StockTrack{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card-header">
    <h1>Welcome back</h1>
    <p>Sign in to your StockTrack account</p>
  </div>

  <form method="post" class="auth-form">
    <div class="form-group">
      <label for="identifier">Username or Email</label>
      <input type="text" id="identifier" name="identifier"
             placeholder="john_doe or john@example.com"
             autocomplete="username" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password"
               placeholder="Your password" autocomplete="current-password" required />
        <button type="button" class="input-toggle-pw" onclick="togglePw('password')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="form-row">
      <label class="checkbox-label">
        <input type="checkbox" name="remember" />
        <span>Remember me</span>
      </label>
    </div>
    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
  </form>

  <div class="auth-footer">
    Don't have an account?
    <a href="{{ url_for('register') }}">Create one free</a>
  </div>
</div>

<script>
function togglePw(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
